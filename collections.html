<!DOCTYPE html>

    <!-- Open Graph -->

    <link rel="apple-touch-icon" href="images/favicon/dark/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    
    <!-- Preloads -->
    <link rel="preload" href="fonts/Eurostile-Extended.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/FiraCode-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/images/grain.avif" as="image">
    <link rel="preload" href="/dist/style.css" as="style">
    <link rel="preload" href="/dist/main.min.css" as="style">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/dist/main.min.css">
    <link rel="stylesheet" href="/dist/style.css">
    <noscript>
        <link rel="stylesheet" href="/dist/main.min.css">
        <link rel="stylesheet" href="/dist/style.css">

    <!-- Script -->
    <script src="dist/script.min.js" defer></script>
</head>
<body>
    <a href="#main-content" class="sr-only focus:not-sr-only absolute flex justify-center bg-black text-white p-2 z-50">[ Skip to content ]</a>

    <div id="header"></div>
    <div id="cartNav"></div>

    <main id="main-content" role="main" class="flex flex-col pl-12 pr-10 text-center min-h-screen">
        <header class="w-full pb-2 border-b border-gray-700">
            <h1 class="text-3xl md:text-4xl pt-12 text-center text-white font-bold uppercase title tracking-tight z-10">Collections</h1>
        </header>
    
        <section class="mt-12 relative">
            <h2 class="text-xl md:text-2xl text-white uppercase mono mb-4 tracking-widest border-b border-gray-700 pb-2">Free Wallpapers</h2>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="relative group overflow-hidden border border-gray-800 shadow-lg">
                    <img src="/images/wallpapers/f488-unleashed-preview.jpg" alt="F488 Unleashed Wallpaper" class="w-full object-cover transition-transform duration-500 group-hover:scale-105" />
                    <div class="absolute inset-0 bg-black bg-opacity-70 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <p class="text-sm uppercase tracking-wider mb-3 text-gray-200">Download for</p>
                        <div class="flex flex-col space-y-2 w-full px-4">
                            <a href="images/wallpapers/f488-unleashed-iphone.png" download="f488-unleashed-iphone.png" class="w-full text-center px-3 py-1 border border-white text-white text-xs uppercase tracking-wide hover:bg-white hover:text-black transition-colors" aria-label="Download for iPhone">iPhone</a>
                            <a href="images/wallpapers/f488-unleashed-android.png" download="f488-unleashed-android.png" class="w-full text-center px-3 py-1 border border-white text-white text-xs uppercase tracking-wide hover:bg-white hover:text-black transition-colors" aria-label="Download for Android">Android</a>
                            <a href="images/wallpapers/f488-unleashed-ipad.png" download="f488-unleashed-ipad.png" class="w-full text-center px-3 py-1 border border-white text-white text-xs uppercase tracking-wide hover:bg-white hover:text-black transition-colors" aria-label="Download for iPad">iPad</a>
                        </div>
                    </div>
                </div>
                <div class="relative group overflow-hidden border border-gray-800 shadow-lg">
                    <img src="/images/wallpapers/mclaren-orange-preview.png" alt="Mclaren Orange Wallpaper" class="w-full object-cover transition-transform duration-500 group-hover:scale-105" />
                    <div class="absolute inset-0 bg-black bg-opacity-70 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <p class="text-sm uppercase tracking-wider mb-3 text-gray-200">Download for</p>
                        <div class="flex flex-col space-y-2 w-full px-4">
                            <a href="images/wallpapers/mclaren-orange-iphone.png" download="mclaren-orange-iphone.png" class="w-full text-center px-3 py-1 border border-white text-white text-xs uppercase tracking-wide hover:bg-white hover:text-black transition-colors" aria-label="Download for iPhone">iPhone</a>
                            <a href="images/wallpapers/mclaren-orange-android.png" download="mclaren-orange-android.png" class="w-full text-center px-3 py-1 border border-white text-white text-xs uppercase tracking-wide hover:bg-white hover:text-black transition-colors" aria-label="Download for Android">Android</a>
                            <a href="images/wallpapers/mclaren-orange-ipad.png" download="mclaren-orange-ipad.png" class="w-full text-center px-3 py-1 border border-white text-white text-xs uppercase tracking-wide hover:bg-white hover:text-black transition-colors" aria-label="Download for iPad">iPad</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <p class="mt-6 text-center text-gray-400 font-mono text-xs uppercase tracking-wide">
            [ For more updates and exclusive sneak peeks, follow us on
            <a href="https://instagram.com/the8tharchive" target="_blank" rel="noopener noreferrer" class="underline hover:text-white">Instagram</a>. ]
        </p>
    </main>

    <div id="footer"></div>

    <script>
        // cart nav
        const count = JSON.parse(localStorage.getItem("cart"))?.reduce((sum, item) => sum + item.quantity, 0) || 0;
        document.getElementById("cartCount").textContent = count;
        
        //center hero
        function setViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('load', setViewportHeight);
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', setViewportHeight);
        
    </script>
</body>
</html>
